<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #3d3d5c);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
        }

        label {
            font-size: 16px;
            margin-bottom: 8px;
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .btn {
            width: 100%;
            background: #ffcc00;
            padding: 12px;
            border: none;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            color: #000;
        }

        .btn:hover {
            background: #ffdb4d;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Contact Us</h2>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message..." required></textarea>

            <button class="btn">Send Message</button>
        </form>

        <div class="info">
            📍 Chennai, India  
            <br>
            📧 support@example.com  
            <br>
            📞 +91 98765 43210
        </div>
    </div>

</body>
</html>
