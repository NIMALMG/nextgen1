<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product – MouneshKumaran</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2b2b45);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 40px;
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .price-tag {
            background: #ffcc00;
            color: #000;
            padding: 10px 18px;
            border-radius: 30px;
            display: inline-block;
            font-size: 16px;
            margin-top: 10px;
            font-weight: 600;
        }

        .btn {
            margin-top: 25px;
            padding: 12px 22px;
            background: #ff4f4f;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        .btn:hover {
            background: #ff2c2c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Product Name: <span style="color:#ffcc00;">MouneshKumaran</span></h1>
        <div class="price-tag">Black Friday Sale: $200</div>

        <button class="btn">Buy Now</button>
    </div>

</body>
</html>
